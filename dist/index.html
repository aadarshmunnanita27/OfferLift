r;gap:16px}.pill{font-size:11px;border-radius:20px;background:var(--light);padding:6px 10px;color:var(--accent)}.steps{counter-reset:step}.steps div{border-bottom:1px solid var(--line);padding:16px 0;line-height:1.7}.steps b{display:block}details{border-bottom:1px solid var(--line);padding:15px 0}summary{cursor:pointer;font-weight:600}code{font-size:12px;background:var(--bg);padding:3px 6px;border-radius:4px}footer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:20px;margin-top:30px}.error{color:#aa3030}.loading{padding:100px;text-align:center}.tiny{font-size:11px} @media(max-width:850px){.grid,.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}.topmeta{display:none}.wrap{padding:24px 5%}.panel{padding:20px}h1{letter-spacing:-1px}.hero{gap:16px}.stat strong{font-size:24px}}@media(max-width:480px){.fields{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 50px}.stats{gap:8px}.stat{padding:16px}}
